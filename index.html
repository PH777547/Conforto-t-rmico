<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MegaG | Controle de Conforto Térmico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#293241;
    --ink-2:#00437B;
    --red:#00437B;
    --red-dark:#293241;
    --orange:#F4971C;
    --paper:#F6F5F8;
    --card:#FFFFFF;
    --line:#E4E2EA;
    --muted:#726F7D;
    --green:#1D8A55;
    --green-bg:#E6F5EC;
    --amber-bg:#FBEFE2;
    --amber:#B4650C;
    --radius:16px;
    --shadow: 0 10px 30px -12px rgba(41,50,65,.18);
    --font-display: 'Segoe UI', 'Roboto', system-ui, sans-serif;
    --font-body: 'Segoe UI', 'Roboto', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- top bar ---------- */
  .topbar{
    background:linear-gradient(120deg,var(--ink) 0%, var(--ink-2) 60%, #3D5A80 100%);
    color:#fff;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute; right:-40px; top:-60px;
    width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle, rgba(244,151,28,.45), transparent 70%);
  }
  .brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .brand-logo{height:38px;width:auto;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  .brand-mark{
    font-family:var(--font-display);
    font-weight:800;
    font-size:22px;
    letter-spacing:.5px;
    background:var(--red);
    color:#fff;
    padding:6px 10px;
    border-radius:8px;
  }
  .brand-title{font-size:15px;font-weight:600;opacity:.92;}
  .brand-sub{font-size:12px;opacity:.62;margin-top:1px;}
  .tabs{display:flex;gap:6px;position:relative;z-index:1;}
  .tab-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    color:#fff;
    padding:9px 16px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  .tab-btn:hover{background:rgba(255,255,255,.16);}
  .tab-btn.active{background:var(--red);border-color:var(--red);}

  main{flex:1;padding:28px 24px 60px;max-width:1080px;margin:0 auto;width:100%;}
  @media(max-width:640px){ main{padding:18px 14px 48px;} .topbar{padding:14px 16px;flex-wrap:wrap;} }

  h1.page-title{font-size:22px;margin:0 0 4px;font-weight:800;}
  p.page-sub{color:var(--muted);margin:0 0 24px;font-size:14px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:24px;
  }
  @media(max-width:640px){ .card{padding:18px;} }

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){ .grid2{grid-template-columns:1fr;} }

  label.field-label{
    display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);
    margin:0 0 6px;text-transform:uppercase;letter-spacing:.4px;
  }
  .field{margin-bottom:18px;}
  select, input[type=text], input[type=date], input[type=time], input[type=number], textarea{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-size:14.5px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    transition:.15s;
  }
  select:focus, input:focus, textarea:focus{
    outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(225,19,42,.12);
  }
  textarea{resize:vertical;min-height:90px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:10px;padding:13px 22px;font-size:14.5px;font-weight:700;
    cursor:pointer;transition:.15s;
  }
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-primary:disabled{background:#D9D6DE;color:#928FA0;cursor:not-allowed;}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{background:var(--ink-2);}
  .btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--ink);}
  .btn-danger{background:#fff;border:1.5px solid #F3C6C6;color:#B3261E;}
  .btn-danger:hover{background:#FDECEC;border-color:#B3261E;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px;}
  .badge-open{background:var(--green-bg);color:var(--green);}
  .badge-closed{background:#EDEBF1;color:var(--muted);}

  /* ---------- training list ---------- */
  .session-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-bottom:12px;display:flex;justify-content:space-between;
    align-items:center;gap:14px;cursor:pointer;transition:.15s;box-shadow:0 2px 8px -4px rgba(11,10,20,.1);
  }
  .session-card:hover{border-color:var(--red);transform:translateY(-1px);}
  .session-name{font-weight:800;font-size:15.5px;margin-bottom:4px;}
  .session-meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
  .session-right{text-align:right;flex-shrink:0;}
  .session-count{font-size:22px;font-weight:800;color:var(--ink);}
  .session-count-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .icon{font-size:40px;margin-bottom:12px;}

  /* ---------- success / qr screen ---------- */
  .qr-wrap{text-align:center;padding:10px 0 6px;}
  #qrcode-box{display:inline-block;padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:14px 0;}
  .link-row{
    display:flex;gap:8px;align-items:center;background:var(--paper);border:1.5px dashed var(--line);
    border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2);word-break:break-all;
  }
  .code-pill{
    display:inline-block;background:var(--ink);color:#fff;font-weight:800;letter-spacing:3px;
    font-size:20px;padding:10px 22px;border-radius:10px;margin:10px 0;
  }

  /* ---------- detail / participants ---------- */
  .detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .detail-info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:18px 0;}
  .info-chip{background:var(--paper);border-radius:10px;padding:10px 12px;}
  .info-chip .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.3px;}
  .info-chip .v{font-size:13.5px;font-weight:700;margin-top:2px;}

  /* ---------- dashboard ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px;}
  .kpi-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .kpi-card .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.3px;}
  .kpi-card .v{font-size:26px;font-weight:800;color:var(--ink);margin-top:4px;}
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:820px){ .chart-grid{grid-template-columns:1fr;} }
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .chart-card h4{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--ink);}
  .chart-wrap{position:relative;width:100%;height:230px;}
  .chart-wrap-tall{position:relative;width:100%;height:280px;}

  .participant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px;}
  .participant-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;position:relative;}
  .participant-card img{width:100%;height:150px;object-fit:cover;display:block;background:#eee;cursor:pointer;}
  .participant-card .pinfo{padding:8px 10px 10px;}
  .participant-card .pname{font-weight:700;font-size:12.5px;line-height:1.25;}
  .participant-card .pdoc{font-size:11px;color:var(--muted);margin-top:2px;}
  .participant-card .ptime{font-size:10.5px;color:var(--muted);margin-top:4px;}
  .del-btn{
    position:absolute;top:6px;right:6px;background:rgba(11,10,20,.65);color:#fff;border:none;
    width:24px;height:24px;border-radius:50%;font-size:13px;cursor:pointer;line-height:1;
  }

  /* ---------- participant (public) mode ---------- */
  .public-shell{max-width:460px;margin:0 auto;padding:20px 16px 60px;}
  .public-card{
    background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:22px;margin-top:14px;
  }
  .public-header{
    background:linear-gradient(120deg,var(--ink), var(--ink-2));color:#fff;border-radius:20px;
    padding:22px 20px;text-align:center;
  }
  .public-header .tag{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.65;font-weight:700;}
  .public-header h2{margin:6px 0 2px;font-size:19px;}
  .public-header .sub{font-size:12.5px;opacity:.75;}

  .type-toggle{display:flex;gap:10px;margin-bottom:4px;}
  .type-toggle label{
    flex:1;border:1.5px solid var(--line);border-radius:10px;padding:11px;text-align:center;
    font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);
  }
  .type-toggle input{display:none;}
  .type-toggle input:checked + span{color:var(--red);}
  .type-toggle label:has(input:checked){border-color:var(--red);background:#E8F1F8;}

  .cam-frame{
    position:relative;width:100%;aspect-ratio:3/4;background:#111;border-radius:16px;overflow:hidden;
    margin-bottom:10px;
  }
  .cam-frame video, .cam-frame img.captured{width:100%;height:100%;object-fit:cover;display:block;}
  .cam-guide{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  }
  .cam-guide svg{width:60%;opacity:.85;}
  .cam-hint{
    position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;font-size:11.5px;
    background:linear-gradient(transparent,rgba(0,0,0,.55));padding:18px 10px 8px;
  }
  .cam-actions{display:flex;gap:10px;}
  .cam-actions .btn{flex:1;}

  .success-screen{text-align:center;padding:40px 10px;}
  .success-icon{
    width:74px;height:74px;border-radius:50%;background:var(--green-bg);color:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px;
  }
  .closed-screen{text-align:center;padding:40px 10px;color:var(--muted);}

  .code-entry{margin-top:26px;text-align:center;}
  .code-entry a{font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline;}
  .code-entry-box{display:none;margin-top:12px;gap:8px;}
  .code-entry-box.show{display:flex;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;
    box-shadow:var(--shadow);z-index:999;opacity:0;transition:.25s;pointer-events:none;
    max-width:min(90vw,480px);text-align:center;line-height:1.4;
  }
  .toast.show{opacity:1;transform:translate(-50%,-6px);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(11,10,20,.55);display:none;align-items:flex-start;justify-content:center;
    padding:30px 14px;z-index:500;overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{background:#fff;border-radius:18px;max-width:900px;width:100%;padding:26px;position:relative;}
  .modal-close{position:absolute;top:16px;right:16px;background:var(--paper);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:999;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:90%;max-height:85%;border-radius:8px;}

  .divider{height:1px;background:var(--line);margin:22px 0;}
  .help-note{font-size:12px;color:var(--muted);margin-top:6px;}
  .actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:20px 0;}

  /* ---------- conforto térmico ---------- */
  .seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-bottom:16px;}
  .seg button{border:none;background:none;padding:8px 18px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;}
  .seg button.on{background:var(--ink-2);color:#fff;}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .filters .field{margin-bottom:0;}
  .dur-chip{display:inline-flex;align-items:center;gap:6px;background:#E8F1F8;color:var(--ink-2);font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px;}
  .ro{background:var(--paper)!important;font-weight:700;}
  .warn-box{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;}
  .tag-legacy{background:#EDEBF1;color:var(--muted);font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;text-transform:uppercase;}
  .hist-row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .hist-row img{width:44px;height:58px;object-fit:cover;border-radius:6px;background:#eee;}
  .hist-row:hover{background:var(--paper);}
  .reg-big{display:grid;grid-template-columns:200px 1fr;gap:20px;}
  .reg-big img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#eee;cursor:pointer;}
  @media(max-width:640px){ .reg-big{grid-template-columns:1fr;} .reg-big img{max-width:220px;} .seg button{padding:8px 12px;} }
  .kpi-card.hl{border-left:4px solid var(--orange);}
  .delta-up{color:var(--green);font-size:12px;font-weight:700;} .delta-down{color:#B3261E;font-size:12px;font-weight:700;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src=""></div>
<div class="modal-overlay" id="password-overlay" style="z-index:600;">
  <div class="modal-box" style="max-width:380px;">
    <button class="modal-close" onclick="closePasswordModal()">✕</button>
    <h3 style="margin:0 0 6px;">Excluir lista</h3>
    <p class="page-sub" id="password-modal-text" style="margin-bottom:16px;"></p>
    <div class="field">
      <label class="field-label">Senha de confirmação</label>
      <input type="password" id="delete-password" placeholder="Digite a senha" autocomplete="off">
    </div>
    <p class="help-note" id="password-error" style="color:#B3261E;display:none;">Senha incorreta. Tente novamente.</p>
    <div class="actions-row" style="margin-top:6px;">
      <button class="btn btn-danger" style="flex:1;" onclick="confirmDeleteSession()">Excluir definitivamente</button>
      <button class="btn btn-outline" onclick="closePasswordModal()">Cancelar</button>
    </div>
  </div>
</div>

/* ===== Constantes de domínio: Conforto Térmico ===== */
const DUR = 20; // minutos, regra obrigatória
const PERIODS = [
  {id:'0800-1800', label:'08h às 18h', ini:'08:00', fim:'18:00'},
  {id:'1600-0100', label:'16h às 01h', ini:'16:00', fim:'01:00'},
  {id:'2000-0500', label:'20h às 05h', ini:'20:00', fim:'05:00'},
  {id:'2200-0700', label:'22h às 07h', ini:'22:00', fim:'07:00'}
];
const UNITS = ["Vargem Grande Paulista","Caçapava","Araraquara","São Paulo - Matriz","Pouso Alegre"];
const LABEL = "Conforto Térmico";

const tmin = t => { const [h,m] = (t||'').split(':').map(Number); return (isNaN(h)||isNaN(m)) ? NaN : h*60+m; };
const mt = m => { m = ((Math.round(m)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const addMin = (t,n) => mt(tmin(t)+n);
const durMin = (a,b) => { let d = tmin(b)-tmin(a); if(d<0) d+=1440; return d; };
const getPeriod = id => PERIODS.find(p=>p.id===id);
function addDays(d,n){ const x = new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); }
// data do turno + horário: após a meia-noite em períodos que viram o dia, a data real é D+1
function realDate(data, periodo, inicio){
  const p = getPeriod(periodo); if(!p || !data) return data;
  const s = tmin(p.ini), e = tmin(p.fim);
  return (e<=s && tmin(inicio) < s) ? addDays(data,1) : data;
}
function validarConforto({periodo, inicio, fim}){
  const p = getPeriod(periodo);
  if(!p) return 'Selecione o período de trabalho';
  if(isNaN(tmin(inicio))) return 'Informe o horário de início';
  if(durMin(inicio, fim) !== DUR) return 'O conforto térmico deve ter exatamente 20 minutos';
  const off = (tmin(inicio) - tmin(p.ini) + 1440) % 1440;
  if(off + DUR > durMin(p.ini, p.fim)) return `Horário fora do período ${p.label}: início e término precisam estar dentro da jornada`;
  return null;
}
function absRange(r){
  const s = Date.parse(r.dataReal+'T'+r.inicio+':00')/60000;
  return [s, s + durMin(r.inicio, r.fim)];
}

/* ===== espelho local (IndexedDB): fotos e registros nunca se perdem, mesmo offline ===== */
const idb = {
  db:null,
  open(){ return new Promise((res)=>{ if(this.db||!window.indexedDB) return res(this.db);
    const rq = indexedDB.open('megag_conforto',1);
    rq.onupgradeneeded = ()=>rq.result.createObjectStore('regs',{keyPath:'id'});
    rq.onsuccess = ()=>{ this.db = rq.result; res(this.db); }; rq.onerror = ()=>res(null); }); },
  async tx(mode, fn){ const db = await this.open(); if(!db) return null;
    return new Promise(res=>{ try{ const t = db.transaction('regs',mode); const rq = fn(t.objectStore('regs'));
      t.oncomplete = ()=>res(rq && rq.result!==undefined ? rq.result : true); t.onerror = ()=>res(null);}catch(e){res(null);} }); },
  put(v){ return this.tx('readwrite', s=>s.put(v)); },
  get(id){ return this.tx('readonly', s=>s.get(id)); },
  all(){ return this.tx('readonly', s=>s.getAll()).then(r=>Array.isArray(r)?r:[]); },
  del(id){ return this.tx('readwrite', s=>s.delete(id)); }
};

const API_URL = "https://script.google.com/macros/s/AKfycbzzOSZQgpepgFQVOqAJ2ngVbjTAzNT987GHg2zceE1yoYXLXAwTnJSGuyRUjTxFReNh/exec";
function checkApiConfigured(){ if(!API_URL || API_URL.indexOf('COLE_AQUI')!==-1) throw new Error('Configure a URL do Google Apps Script na constante API_URL.'); }
async function apiGet(params){
  checkApiConfigured(); const url = new URL(API_URL);
  Object.keys(params).forEach(k=>url.searchParams.set(k, params[k]));
  let res; try{ res = await fetch(url.toString()); }catch(e){ throw new Error('Não foi possível conectar ao servidor. Verifique sua internet.'); }
  const json = await res.json(); if(!json.ok) throw new Error(json.error||'Erro desconhecido no servidor.'); return json.data;
}
async function apiPost(payload){
  checkApiConfigured(); let res;
  try{ res = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); }
  catch(e){ throw new Error('Não foi possível conectar ao servidor. Verifique sua internet.'); }
  const json = await res.json(); if(!json.ok) throw new Error(json.error||'Erro desconhecido no servidor.'); return json.data;
}

function normReg(p, s){
  const inicio = p.inicio||'', periodo = p.periodo || (s&&s.periodo) || '', data = p.data || (s&&s.data) || '';
  const ts = p.timestamp ? new Date(Number(p.timestamp)) : null;
  const legacy = !inicio;
  return Object.assign({}, p, {
    unidade: p.unidade || (s&&s.unidade) || '', periodo, data, inicio,
    fim: p.fim || (inicio ? addMin(inicio, DUR) : ''),
    hora: inicio || (ts && !isNaN(ts) ? mt(ts.getHours()*60+ts.getMinutes()) : ''),
    dataReal: p.dataReal || (inicio ? realDate(data, periodo, inicio) : data),
    legacy, sessionTitle:(s&&s.training)||'', codigo:(s&&(s.codigo||s.id.slice(-6).toUpperCase()))||''
  });
}
// registro novo: grava primeiro no aparelho (foto inclusa) e depois no servidor
async function saveRegistro(r){
  await idb.put(Object.assign({}, r, {pending:true}));
  const payload = Object.assign({}, r); // foto segue em base64: fica na plataforma, sem Drive
  try{ await apiPost({action:'saveParticipant', participant:JSON.stringify(payload)}); await idb.put(Object.assign({}, r, {pending:false})); return {synced:true}; }
  catch(e){ console.error(e); return {synced:false, error:e}; }
}
async function syncPending(){
  const loc = await idb.all(); let n = 0;
  for(const r of loc.filter(x=>x.pending)){
    try{ await apiPost({action:'saveParticipant', participant:JSON.stringify(Object.assign({},r,{pending:undefined}))}); await idb.put(Object.assign({},r,{pending:false})); n++; }catch(e){ break; }
  }
  return n;
}
async function listRegistros(sessionId, session){
  let remote = []; try{ remote = (await apiGet({action:'listParticipants', sessionId})) || []; }catch(e){ console.error(e); }
  const loc = (await idb.all()).filter(x=>x.sessionId===sessionId);
  const byId = {}; loc.forEach(x=>byId[x.id]=x);
  const out = remote.map(p=>{ const l = byId[p.id]; delete byId[p.id];
    if(!l) return p; // preenche o que o servidor não guardou (ex.: foto ou horários)
    return Object.assign({}, l, p, {foto: (p.foto && p.foto.startsWith('data:')) ? p.foto : (l.foto||p.foto), inicio:p.inicio||l.inicio, fim:p.fim||l.fim, periodo:p.periodo||l.periodo, unidade:p.unidade||l.unidade, data:p.data||l.data, dataReal:p.dataReal||l.dataReal}); });
  Object.values(byId).forEach(l=>out.push(l)); // pendentes ainda não enviados
  const s = session || await getSession(sessionId);
  return out.map(p=>normReg(p, s));
}
async function loadAll(force){
  if(state.allLoaded && !force) return state.all;
  const sessions = await listSessions(); state.sessions = sessions;
  const all = []; const queue = sessions.slice();
  const worker = async()=>{ while(queue.length){ const s = queue.shift(); all.push(...await listRegistros(s.id, s)); } };
  await Promise.all([worker(),worker(),worker(),worker()]);
  all.sort((a,b)=>(b.dataReal+(b.hora||'')).localeCompare(a.dataReal+(a.hora||'')));
  state.all = all; state.allLoaded = true; return all;
}

function applyFilters(list, f){
  const q = (f.q||'').trim().toLowerCase();
  const hd = tmin(f.hde), ha = tmin(f.hate);
  return list.filter(r=>{
    if(q && !((r.nome||'').toLowerCase().includes(q) || (r.documento||'').toString().toLowerCase().includes(q))) return false;
    if(f.unidade && r.unidade !== f.unidade) return false;
    if(f.periodo && r.periodo !== f.periodo) return false;
    if(f.de && r.dataReal < f.de) return false;
    if(f.ate && r.dataReal > f.ate) return false;
    if(!isNaN(hd) || !isNaN(ha)){
      const h = tmin(r.hora); if(isNaN(h)) return false;
      const a = isNaN(hd)?0:hd, b = isNaN(ha)?1439:ha;
      if(a<=b ? (h<a||h>b) : (h<a&&h>b)) return false; // faixa que atravessa a meia-noite
    }
    return true;
  });
}

function regRow(r){
  return { "Nome Completo":r.nome, "Matrícula":r.documento, "Unidade":r.unidade, "Período":r.periodo?periodLabel(r.periodo):'',
    "Data do Turno":fmtDate(r.data), "Data Real":fmtDate(r.dataReal), "Início":r.inicio||'', "Término":r.fim&&r.inicio?r.fim:'',
    "Duração (min)":r.inicio?DUR:'', "Foto":r.foto?'Sim':'Não', "Origem":r.legacy?('Treinamento: '+r.sessionTitle):LABEL, "Código da Lista":r.codigo };

function exportExcel(list, base){
  if(!list.length) return showToast('Nenhum registro para exportar.');
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(list.map(regRow));
  ws['!cols'] = [28,14,22,12,13,13,8,9,13,7,30,12].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, "Registros");
  const by = {}; list.forEach(r=>{ const k=r.documento+'|'+r.nome; by[k]=by[k]||{"Nome Completo":r.nome,"Matrícula":r.documento,"Unidade":r.unidade,"Registros":0,"Minutos":0}; by[k]["Registros"]++; if(r.inicio) by[k]["Minutos"]+=DUR; });
  const ws2 = XLSX.utils.json_to_sheet(Object.values(by).sort((a,b)=>b.Registros-a.Registros));
  ws2['!cols'] = [{wch:28},{wch:14},{wch:22},{wch:11},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, "Por colaborador");
  XLSX.writeFile(wb, `${base}_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast(`Excel exportado! ${list.length} registro(s).`);
}

/* ===== Exportação: PDF profissional (fotos incorporadas) ===== */
const imgSize = src => new Promise(res=>{ const i=new Image(); i.onload=()=>res([i.naturalWidth,i.naturalHeight]); i.onerror=()=>res([1,1]); i.src=src; });
async function photoForPdf(src){ // data URI direto; URL antiga (Drive) é convertida em imagem incorporada quando o navegador permitir
  if(!src) return null;
  if(src.startsWith('data:')) return src;
  return new Promise(res=>{ const i=new Image(); i.crossOrigin='anonymous';
    i.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=i.naturalWidth; c.height=i.naturalHeight; c.getContext('2d').drawImage(i,0,0); res(c.toDataURL('image/jpeg',.75)); }catch(e){res(null);} };
    i.onerror=()=>res(null); setTimeout(()=>res(null),6000); i.src=src; });
}
async function buildPDF(list, titulo){
  const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:'mm', format:'a4'});
  const W=210, M=12, H=297, CARD=47, GAP=3;
  const [lw,lh] = await imgSize(MEGAG_LOGO_DATAURI);
  const navy=[41,50,65], blue=[0,67,123], orange=[244,151,28], gray=[114,111,125];
  const head = (first)=>{
    doc.setFillColor(...navy); doc.rect(0,0,W,first?28:14,'F'); doc.setFillColor(...orange); doc.rect(0,first?28:14,W,1.2,'F');
    const lhh = first?16:8; doc.addImage(MEGAG_LOGO_DATAURI,'PNG',M,first?6:3,lhh*lw/lh,lhh);
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(first?15:10);
    doc.text(titulo, W-M, first?13:9, {align:'right'});
    if(first){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text('Controle de Conforto Térmico · SESMT · MegaG Alimentos', W-M, 20, {align:'right'}); }
  };
  head(true);
  const comTempo = list.filter(r=>r.inicio);
  const dts = list.map(r=>r.dataReal).filter(Boolean).sort();
  const colab = new Set(list.map(r=>r.documento)).size;
  doc.setTextColor(...gray); doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(`Emitido em ${new Date().toLocaleString('pt-BR')}  ·  ${list.length} registro(s)  ·  ${colab} colaborador(es)  ·  Duração padrão: ${DUR} min` + (dts.length?`  ·  Período: ${fmtDate(dts[0])} a ${fmtDate(dts[dts.length-1])}`:''), M, 36);
  let y = 41, n = 0;
  for(const r of list){
    if(y+CARD > H-14){ doc.addPage(); head(false); y = 20; }
    doc.setDrawColor(228,226,234); doc.setFillColor(255,255,255); doc.roundedRect(M,y,W-2*M,CARD,2,2,'FD');
    doc.setFillColor(...blue); doc.rect(M,y,1.6,CARD,'F');
    const ph = await photoForPdf(r.foto), px=M+5, pw=29, pH=pw*4/3;
    if(ph){ try{ doc.addImage(ph, ph.indexOf('image/png')>0?'PNG':'JPEG', px, y+3.3, pw, pH, undefined, 'FAST'); }catch(e){ ph0(doc,px,y,pw,pH); } } else ph0(doc,px,y,pw,pH);
    doc.setDrawColor(200,198,208); doc.rect(px,y+3.3,pw,pH);
    const tx = px+pw+6, c2 = tx+62, c3 = tx+104;
    doc.setTextColor(...navy); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(String(r.nome||'').slice(0,44), tx, y+9);
    doc.setFontSize(8); doc.setTextColor(...gray); doc.setFont('helvetica','normal'); doc.text('#'+(++n), W-M-3, y+7, {align:'right'});
    const cell = (lbl,val,cx,cy,bold)=>{ doc.setFontSize(7); doc.setTextColor(...gray); doc.setFont('helvetica','bold'); doc.text(lbl.toUpperCase(),cx,cy);
      doc.setFontSize(10); doc.setTextColor(...(bold?blue:navy)); doc.setFont('helvetica',bold?'bold':'normal'); doc.text(String(val||'-'),cx,cy+5); };
    cell('Matrícula', r.documento, tx, y+16); cell('Unidade', r.unidade, c2, y+16);
    cell('Data', fmtDate(r.dataReal)+(r.data&&r.dataReal!==r.data?' (turno '+fmtDate(r.data)+')':''), tx, y+27);
    cell('Período', r.periodo?periodLabel(r.periodo):'-', c2, y+27);
    cell('Início', r.inicio||'-', tx, y+37.5, true); cell('Término', r.inicio?r.fim:'-', c2, y+37.5, true); cell('Duração', r.inicio?DUR+' min':'-', c3, y+37.5);
    y += CARD+GAP;
  }
  const pages = doc.getNumberOfPages();
  for(let p=1;p<=pages;p++){ doc.setPage(p); doc.setFontSize(8); doc.setTextColor(...gray); doc.setFont('helvetica','normal');
    doc.text('MegaG Alimentos · SESMT · Controle de Conforto Térmico', M, H-7); doc.text(`Página ${p} de ${pages}`, W-M, H-7, {align:'right'}); }
  return doc;
}
async function exportPDF(list, titulo){
  if(!list.length) return showToast('Nenhum registro para exportar.');
  if(!window.jspdf) return showToast('Biblioteca de PDF não carregada. Verifique a internet.');
  showToast(`Gerando PDF com ${list.length} registro(s)…`);
  try{
    const sorted = list.slice().sort((a,b)=>(a.dataReal+(a.hora||'')).localeCompare(b.dataReal+(b.hora||'')));
    const doc = await buildPDF(sorted, titulo);
    doc.save(`Conforto_Termico_${new Date().toISOString().slice(0,10)}.pdf`); showToast('PDF gerado!');
  }catch(e){ console.error(e); showToast('Erro ao gerar PDF: '+(e.message||'tente novamente')); }
}
function ph0(doc,x,y,w,h){ doc.setFillColor(233,231,238); doc.rect(x,y+3.3,w,h,'F'); doc.setFontSize(7); doc.setTextColor(114,111,125); doc.text('Sem foto',x+w/2,y+3.3+h/2,{align:'center'}); }

/* ===== Dashboard ===== */
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const mesLabel = k => { const [y,m]=k.split('-'); return MESES[+m-1]+'/'+y.slice(2); };
const monthKey = (d)=>d.slice(0,7);
function lastMonths(n){ const out=[]; const d=new Date(); d.setDate(1); for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(), d.getMonth()-i, 1); out.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')); } return out; }
const topN = (obj,n)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);

async function renderDashboardTab(){
  const el = document.getElementById('main-content');

  const recs = base.filter(r=>(!D.unidade||r.unidade===D.unidade)&&(!D.de||r.dataReal>=D.de)&&(!D.ate||r.dataReal<=D.ate));
  const filt = `<div class="card" style="margin-bottom:18px;"><div class="filters">
      <div class="field"><label class="field-label">Data de</label><input type="date" id="d-de" value="${D.de}" onchange="onDash()"></div>
      <div class="field"><label class="field-label">Data até</label><input type="date" id="d-ate" value="${D.ate}" onchange="onDash()"></div>

    el.innerHTML = `<h1 class="page-title">Dashboard</h1><p class="page-sub">Panorama dos conforto térmicos registrados.</p>${filt}<div class="card"><div class="empty-state"><div class="icon">📊</div>Ainda não há registros de conforto térmico para o filtro selecionado.${legacyN?`<br><small>${legacyN} registro(s) históricos de treinamentos foram preservados no Histórico.</small>`:''}</div></div>`;
    return;
  }
  const colabs = {}, porUn = {}, porHora = {}, porMes = {}, dias = new Set(), porPer = {};
  recs.forEach(r=>{
    const k = r.documento+'|'+r.nome; colabs[k] = (colabs[k]||0)+1;
    porUn[r.unidade||'—'] = (porUn[r.unidade||'—']||0)+1;
    const h = String(tmin(r.inicio)/60|0).padStart(2,'0')+'h'; porHora[h]=(porHora[h]||0)+1;
    const m = monthKey(r.dataReal); porMes[m]=(porMes[m]||0)+1; dias.add(r.dataReal);
    (porPer[r.periodo]=porPer[r.periodo]||{}); porPer[r.periodo][m]=(porPer[r.periodo][m]||0)+1;
  });
  const meses = lastMonths(12), cur = meses[11], prev = meses[10];
  const nCur = porMes[cur]||0, nPrev = porMes[prev]||0;
  const delta = nPrev ? Math.round((nCur-nPrev)/nPrev*100) : null;
  const media = recs.length/dias.size;
  const pico = topN(porHora,1)[0];
  el.innerHTML = `<h1 class="page-title">Dashboard</h1><p class="page-sub">Panorama dos conforto térmicos registrados (duração padrão de ${DUR} minutos).</p>${filt}
    <div class="kpi-grid">
      <div class="kpi-card hl"><div class="k">Total de registros</div><div class="v">${recs.length}</div></div>
      <div class="kpi-card"><div class="k">Colaboradores participantes</div><div class="v">${Object.keys(colabs).length}</div></div>
      <div class="kpi-card"><div class="k">Média diária</div><div class="v">${media.toFixed(1)}</div></div>
      <div class="kpi-card"><div class="k">Mês atual (${mesLabel(cur)})</div><div class="v">${nCur}</div>${delta!==null?`<div class="${delta>=0?'delta-up':'delta-down'}">${delta>=0?'▲':'▼'} ${Math.abs(delta)}% vs mês anterior</div>`:''}</div>
      <div class="kpi-card"><div class="k">Horário de pico</div><div class="v">${pico?pico[0]:'—'}</div></div>
      <div class="kpi-card"><div class="k">Tempo total de pausa</div><div class="v">${(recs.length*DUR/60).toFixed(1)}h</div></div>
    </div>
    <div class="chart-grid" style="margin-bottom:20px;">
      <div class="chart-card"><h4>Quantidade mensal (12 meses)</h4><div class="chart-wrap"><canvas id="cMes" role="img" aria-label="Quantidade mensal"></canvas></div></div>
      <div class="chart-card"><h4>Evolução mensal (variação % sobre o mês anterior)</h4><div class="chart-wrap"><canvas id="cEvo" role="img" aria-label="Evolução mensal"></canvas></div></div>
    </div>
    <div class="chart-grid" style="margin-bottom:20px;">
      <div class="chart-card"><h4>Horários de maior realização (início)</h4><div class="chart-wrap-tall"><canvas id="cHora" role="img" aria-label="Horários"></canvas></div></div>
      <div class="chart-card"><h4>Registros por unidade</h4><div class="chart-wrap-tall"><canvas id="cUn" role="img" aria-label="Por unidade"></canvas></div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-card"><h4>Colaboradores com mais registros</h4><div class="chart-wrap-tall"><canvas id="cTop" role="img" aria-label="Top colaboradores"></canvas></div></div>
      <div class="chart-card"><h4>Comparativo entre períodos (mês anterior x atual)</h4><div class="chart-wrap-tall"><canvas id="cPer" role="img" aria-label="Comparativo de períodos"></canvas></div></div>
    </div>
    ${legacyN?`<p class="help-note" style="margin-top:16px;">${legacyN} registro(s) históricos de treinamentos permanecem preservados no Histórico e não entram nestes indicadores.</p>`:''}`;
  if(!window.Chart) return;
  Object.values(state.charts).forEach(c=>c.destroy()); state.charts = {};
  const blue='#00437B', orange='#F4971C', navy='#293241', muted='#726F7D', grid='rgba(114,111,125,0.14)';
  const opt = (extra={})=>Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{color:muted,precision:0},grid:{color:grid}},x:{ticks:{color:muted},grid:{display:false}}}},extra);
  const hor = (o)=>Object.assign(o,{indexAxis:'y',scales:{x:{beginAtZero:true,ticks:{color:muted,precision:0},grid:{color:grid}},y:{ticks:{color:muted},grid:{display:false}}}});
  const mk=(id,cfg)=>{ state.charts[id]=new Chart(document.getElementById(id),cfg); };
  mk('cMes',{type:'bar',data:{labels:meses.map(mesLabel),datasets:[{data:meses.map(m=>porMes[m]||0),backgroundColor:blue,borderRadius:4,maxBarThickness:28}]},options:opt()});
  const evo = meses.map((m,i)=>{ if(!i) return null; const a=porMes[meses[i-1]]||0,b=porMes[m]||0; return a? Math.round((b-a)/a*100) : null; });
  mk('cEvo',{type:'line',data:{labels:meses.map(mesLabel),datasets:[{data:evo,borderColor:orange,backgroundColor:orange,tension:.3,spanGaps:true,pointRadius:4}]},options:opt({scales:{y:{ticks:{color:muted,callback:v=>v+'%'},grid:{color:grid}},x:{ticks:{color:muted},grid:{display:false}}}})});
  const hrs = Object.keys(porHora).sort();
  mk('cHora',{type:'bar',data:{labels:hrs,datasets:[{data:hrs.map(h=>porHora[h]),backgroundColor:hrs.map(h=>pico&&h===pico[0]?orange:blue),borderRadius:4,maxBarThickness:28}]},options:opt()});
  const un = topN(porUn,8);
  mk('cUn',{type:'doughnut',data:{labels:un.map(u=>u[0]),datasets:[{data:un.map(u=>u[1]),backgroundColor:[blue,orange,navy,'#3D5A80','#1D8A55','#B4650C','#726F7D','#98C1D9']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:muted,boxWidth:12}}}}});
  const tp = topN(colabs,8);
  mk('cTop',{type:'bar',data:{labels:tp.map(t=>{const n=t[0].split('|')[1]||'';return n.length>24?n.slice(0,22)+'…':n;}),datasets:[{data:tp.map(t=>t[1]),backgroundColor:navy,borderRadius:4,maxBarThickness:18}]},options:hor(opt())});
  mk('cPer',{type:'bar',data:{labels:PERIODS.map(p=>p.label),datasets:[
    {label:mesLabel(prev),data:PERIODS.map(p=>(porPer[p.id]||{})[prev]||0),backgroundColor:'#98C1D9',borderRadius:4},
    {label:mesLabel(cur),data:PERIODS.map(p=>(porPer[p.id]||{})[cur]||0),backgroundColor:orange,borderRadius:4}]},
    options:opt({plugins:{legend:{display:true,position:'bottom',labels:{color:muted,boxWidth:12}}}})});
}

async function toggleStatus(id, cur){
  const s = await getSession(id); const closing = cur==='aberto'; s.status = closing?'encerrado':'aberto'; await saveSession(s); refreshDetail();
  if(!closing) return showToast('Lista reaberta');
  if(s.periodo) return showToast('Lista encerrada.');
  if(s.avaliacaoEnviada===true||s.avaliacaoEnviada==='true') return showToast('Encerrada. (Avaliação já enviada antes.)');
  try{ const r = await sendEvaluationEmails(id); showToast(!r.formConfigured?'Encerrada. Formulário de avaliação não configurado.':r.sent?`Encerrada. Avaliação enviada para ${r.sent}.`:'Encerrada. Ninguém informou e-mail.'); }catch(e){ showToast('Encerrada, mas a avaliação falhou: '+(e.message||'')); }
}
async function reenviarAvaliacao(id){ try{ const r = await sendEvaluationEmails(id); showToast(r.sent?`Avaliação enviada para ${r.sent}.`:'Nada enviado.'); }catch(e){ showToast('Erro: '+(e.message||'')); } }
async function saveObs(id){ const s = await getSession(id); s.observacoes = document.getElementById('detail-obs').value; await saveSession(s); showToast('Observações salvas'); }
async function removerRegistro(sid,pid){ if(!confirm('Remover este registro?')) return; await deleteParticipant(sid,pid); state.allLoaded=false; showToast('Registro removido'); refreshDetail(); }

const DELETE_PASSWORD = 'MegaG123'; let pendingDeleteSessionId = null;
function askDeleteSession(id,name){
  pendingDeleteSessionId = id;
  document.getElementById('password-modal-text').textContent = `Esta ação apaga permanentemente "${name}" e todos os registros e fotos dela. Não pode ser desfeita.`;
  document.getElementById('delete-password').value=''; document.getElementById('password-error').style.display='none';
  document.getElementById('password-overlay').classList.add('show'); setTimeout(()=>document.getElementById('delete-password').focus(),100);
}
function closePasswordModal(){ document.getElementById('password-overlay').classList.remove('show'); pendingDeleteSessionId=null; }
async function confirmDeleteSession(){
  if(document.getElementById('delete-password').value !== DELETE_PASSWORD){ document.getElementById('password-error').style.display='block'; return; }
  const id = pendingDeleteSessionId; closePasswordModal(); showToast('Excluindo lista…');
  try{ await deleteSession(id); for(const r of (await idb.all()).filter(x=>x.sessionId===id)) await idb.del(r.id); showToast('Lista excluída.'); closeDetail(); }
  catch(e){ showToast('Erro ao excluir: '+(e.message||'tente novamente')); }
}
document.getElementById('delete-password')?.addEventListener?.('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); confirmDeleteSession(); } });

async function goToCode(){
  const code = document.getElementById('manual-code').value.trim().toLowerCase(); if(!code) return;
  const m = (await listSessions()).find(s=>(s.codigo||s.id.slice(-6).toUpperCase()).toLowerCase()===code);
  if(m) window.location.hash = 'session='+m.id; else showToast('Código não encontrado');
}
async function renderParticipantMode(){
  const app = document.getElementById('app'); const s = await getSession(state.currentSessionId); state.session = s;
  if(!s){ app.innerHTML = publicShell(`<div class="closed-screen"><div style="font-size:38px">🔎</div><h2>Lista não encontrada</h2><p>Confira o link ou peça um novo código ao SESMT.</p></div>`); return; }
  if(s.status!=='aberto'){ app.innerHTML = publicShell(`<div class="closed-screen"><div style="font-size:38px">🔒</div><h2>Registro encerrado</h2><p>Esta lista não aceita mais registros. Procure o SESMT.</p></div>`); return; }
  app.innerHTML = publicShell(`<div class="public-header"><div class="tag">Registro de Conforto Térmico</div><h2>${esc(s.unidade)} · ${esc(s.local)}</h2>
    <div class="sub">${fmtDate(s.data)}${s.periodo?' · '+periodLabel(s.periodo):''}</div></div><div class="public-card" id="participant-form-card"></div>`);
  renderParticipantForm();
}
function renderParticipantForm(){
  const s = state.session; const now = new Date(); const nowT = mt(now.getHours()*60+now.getMinutes());
  document.getElementById('participant-form-card').innerHTML = `
    <div class="field"><label class="field-label">Nome completo</label><input type="text" id="p-nome" placeholder="Digite seu nome completo" autocomplete="name"></div>
    <div class="grid2"><div class="field"><label class="field-label">Matrícula</label><input type="text" id="p-doc" inputmode="numeric" placeholder="Número da matrícula"></div>
      <div class="field"><label class="field-label">Unidade</label><select id="p-unidade">${unitOptionsHTML(s.unidade)}</select></div></div>
    <div class="field"><label class="field-label">Período de trabalho</label><select id="p-periodo" onchange="updFim()">${periodOptionsHTML(s.periodo)}</select></div>
    <div class="grid2"><div class="field"><label class="field-label">Início</label><input type="time" id="p-inicio" value="${nowT}" oninput="updFim()"></div>
      <div class="field"><label class="field-label">Término (automático)</label><input type="text" id="p-fim" class="ro" readonly></div></div>
    <div style="margin:-6px 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><span class="dur-chip">⏱ Duração fixa: ${DUR} min</span><button class="btn btn-outline btn-sm" type="button" onclick="document.getElementById('p-inicio').value=mt(new Date().getHours()*60+new Date().getMinutes());updFim()">Usar horário atual</button></div>
    <div id="p-warn"></div>
    <div class="field"><label class="field-label">Foto do colaborador</label>
      <div class="cam-frame" id="cam-frame"><div class="cam-guide"><svg viewBox="0 0 100 130" fill="none" stroke="white" stroke-width="2"><ellipse cx="50" cy="55" rx="30" ry="38"/><path d="M15 120 Q50 90 85 120"/></svg></div><div class="cam-hint">Posicione o rosto dentro da moldura</div></div>
      <div class="cam-actions" id="cam-actions"><button class="btn btn-dark btn-block" onclick="startCamera()">📷 Abrir câmera</button></div>
      <input type="file" id="file-fallback" accept="image/*" capture="user" style="display:none;" onchange="handleFileFallback(event)">
      <p class="help-note">Problemas com a câmera? <a style="cursor:pointer;text-decoration:underline;" onclick="document.getElementById('file-fallback').click()">Enviar uma foto</a></p></div>
    <button class="btn btn-primary btn-block" id="btn-registrar" disabled onclick="registrarConforto()">Registrar conforto térmico</button>`;
  updFim();
}
function updFim(){
  const ini = document.getElementById('p-inicio').value, per = document.getElementById('p-periodo').value;
  const fim = isNaN(tmin(ini)) ? '' : addMin(ini, DUR); document.getElementById('p-fim').value = fim;
  const err = fim ? validarConforto({periodo:per, inicio:ini, fim}) : null;
  document.getElementById('p-warn').innerHTML = err ? `<div class="warn-box">⚠ ${esc(err)}</div>` : (fim && getPeriod(per) && tmin(fim)<tmin(ini) ? `<div class="help-note">Término após a meia-noite (${fmtDate(addDays(realDate(state.session.data,per,ini),1))}).</div>` : '');
  checkFormReady();
}
const checkFormReady = ()=>{ const b = document.getElementById('btn-registrar'); if(b) b.disabled = !state.capturedPhoto; };
async function startCamera(){
  const frame = document.getElementById('cam-frame');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}); state.camStream = stream;
    frame.innerHTML = `<video id="cam-video" autoplay playsinline muted></video><div class="cam-guide"><svg viewBox="0 0 100 130" fill="none" stroke="white" stroke-width="2"><ellipse cx="50" cy="55" rx="30" ry="38"/><path d="M15 120 Q50 90 85 120"/></svg></div><div class="cam-hint">Centralize o rosto e toque em "Tirar foto"</div>`;
    document.getElementById('cam-video').srcObject = stream;
    document.getElementById('cam-actions').innerHTML = `<button class="btn btn-primary btn-block" onclick="capturePhoto()">Tirar foto</button>`;
  }catch(e){ showToast('Não foi possível acessar a câmera. Use o envio de foto abaixo.'); }
}
// foto reduzida (360x480 JPEG) para ficar guardada no próprio registro
function drawToJpeg(src, sw0, sh0, mirror){
  const c = document.createElement('canvas'); c.width=360; c.height=480; const ctx = c.getContext('2d');
  const sc = Math.max(c.width/sw0, c.height/sh0), sw = c.width/sc, sh = c.height/sc;
  if(mirror){ ctx.translate(c.width,0); ctx.scale(-1,1); }
  ctx.drawImage(src,(sw0-sw)/2,(sh0-sh)/2,sw,sh,0,0,c.width,c.height);
  let q = .72, out = c.toDataURL('image/jpeg',q); while(out.length>42000 && q>.35){ q-=.08; out = c.toDataURL('image/jpeg',q); } return out;
}
function capturePhoto(){ const v = document.getElementById('cam-video'); finishCapture(drawToJpeg(v, v.videoWidth, v.videoHeight, true)); }
function handleFileFallback(ev){
  const f = ev.target.files[0]; if(!f) return; const rd = new FileReader();
  rd.onload = ()=>{ const i = new Image(); i.onload = ()=>finishCapture(drawToJpeg(i, i.width, i.height, false)); i.src = rd.result; }; rd.readAsDataURL(f);
}
function finishCapture(url){
  state.capturedPhoto = url; stopCamera();
  document.getElementById('cam-frame').innerHTML = `<img class="captured" src="${url}">`;
  document.getElementById('cam-actions').innerHTML = `<button class="btn btn-outline btn-block" onclick="retakePhoto()">Tirar novamente</button>`; checkFormReady();
}
function retakePhoto(){ state.capturedPhoto=null; startCamera(); checkFormReady(); }
function stopCamera(){ if(state.camStream){ state.camStream.getTracks().forEach(t=>t.stop()); state.camStream=null; } }

async function registrarConforto(){
  const v = id=>document.getElementById(id).value.trim(); const s = state.session;
  const nome=v('p-nome'), doc=v('p-doc'), unidade=v('p-unidade'), periodo=v('p-periodo'), inicio=v('p-inicio'), fim=isNaN(tmin(inicio))?'':addMin(inicio,DUR);
  if(nome.split(/\s+/).filter(Boolean).length<2) return showToast('Informe o nome completo (nome e sobrenome)');
  if(!doc) return showToast('Informe a matrícula');
  const err = validarConforto({periodo,inicio,fim}); if(err) return showToast(err);
  if(!state.capturedPhoto) return showToast('Tire uma foto para continuar');
  const btn = document.getElementById('btn-registrar'); btn.disabled=true; btn.innerHTML = spin()+' Registrando…';
  const r = { id:uid('p'), sessionId:s.id, nome, tipo:'colaborador', documento:doc, email:'', unidade, periodo, data:s.data,
    dataReal:realDate(s.data,periodo,inicio), inicio, fim, duracao:DUR, foto:state.capturedPhoto, timestamp:Date.now() };
  // evita sobreposição de dois conforto térmicos do mesmo colaborador
  try{
    const mine = (await listRegistros(s.id, s)).filter(x=>x.inicio && (x.documento||'').toString()===doc);
    const [a1,a2] = absRange(r);
    if(mine.some(x=>{ const [b1,b2]=absRange(x); return a1<b2 && b1<a2; })){ showToast('Já existe um conforto térmico deste colaborador que se sobrepõe a este horário.'); btn.disabled=false; btn.innerHTML='Registrar conforto térmico'; return; }
  }catch(e){}
  const res = await saveRegistro(r); stopCamera(); state.allLoaded = false;
  document.getElementById('participant-form-card').innerHTML = `<div class="success-screen"><div class="success-icon">✓</div><h2>Conforto térmico registrado!</h2>
    <p>${esc(nome)}<br><strong>${esc(inicio)} → ${esc(fim)}</strong> (${DUR} min)</p>
    ${res.synced?'':'<div class="warn-box">Sem conexão com o servidor: o registro e a foto foram guardados neste aparelho e serão enviados automaticamente.</div>'}
    <button class="btn btn-outline" style="margin-top:16px;" onclick="state.capturedPhoto=null;renderParticipantForm()">Registrar outra pessoa neste aparelho</button></div>`;
}

/* ===== init ===== */
window.addEventListener('online', ()=>syncPending());
render();

</script>
